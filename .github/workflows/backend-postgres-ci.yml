name: backend-postgres-ci

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-postgres-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-postgres-ci.yml'

concurrency:
  group: backend-postgres-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dj_bridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dj_bridge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Wait for Postgres readiness
        env:
          PGPASSWORD: postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres -d dj_bridge && exit 0
            echo "waiting for postgres... ($i/30)"
            sleep 2
          done
          echo "postgres did not become ready in time" >&2
          exit 1

      - name: Run Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dj_bridge
        run: alembic upgrade head

      - name: Run Postgres live tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dj_bridge
          DJ_STORAGE_BACKEND: postgres
          RUN_POSTGRES_TESTS: '1'
        run: pytest -q -m postgres_live

      - name: Run backend test suite (without postgres_live)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dj_bridge
          DJ_STORAGE_BACKEND: sqlite
        run: pytest -q -m "not postgres_live"
