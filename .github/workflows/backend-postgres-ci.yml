name: backend-postgres-ci

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-postgres-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-postgres-ci.yml'

jobs:
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dj_bridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dj_bridge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dj_bridge
        run: alembic upgrade head

      - name: Run Postgres integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dj_bridge
          DJ_STORAGE_BACKEND: postgres
          RUN_POSTGRES_TESTS: '1'
        run: pytest -q tests/infrastructure/test_postgres_live_repositories.py

      - name: Run backend test suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dj_bridge
          DJ_STORAGE_BACKEND: sqlite
        run: pytest -q
